<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-UK9O+rbB3KhDsGQrE55qyNAJCpV7WHc47zV2U5f4bE4='; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com">
  <meta name="referrer" content="no-referrer">
  <title>Agent HQ District</title>
  <meta name="theme-color" content="#0d1220">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="district.css">
  <!-- three.js is pinned; the CSP hash below must change if this map changes. -->
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div id="stage"></div>

  <header id="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <div class="title">Agent HQ District</div>
        <div class="sub" id="clock">Day 1 · 06:00</div>
      </div>
    </div>
    <a class="back" href="../">◀ Goldenrod</a>
    <div class="chips" id="chips"></div>
    <div class="speed" id="speed">
      <button data-speed="0" title="Pause">❚❚</button>
      <button data-speed="1" class="on">1×</button>
      <button data-speed="2">2×</button>
      <button data-speed="4">4×</button>
    </div>
  </header>

  <aside id="panel">
    <nav class="tabs" id="tabs">
      <button data-tab="hub" class="on">Agent Hub</button>
      <button data-tab="exchange">Exchange</button>
      <button data-tab="tickets">Tickets</button>
      <button data-tab="chat">Chat</button>
    </nav>
    <section class="tab-body" id="tab-hub"></section>
    <section class="tab-body" id="tab-exchange" hidden></section>
    <section class="tab-body" id="tab-tickets" hidden></section>
    <section class="tab-body" id="tab-chat" hidden><div id="chat-feed"></div></section>
    <button id="panel-toggle" title="Toggle panel">⟩</button>
  </aside>

  <div id="inspector" hidden></div>
  <div id="feed"></div>
  <div id="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
